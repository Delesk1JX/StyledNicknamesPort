## Minecraft 26.1.2 with NeoForge
minecraft_version=26.1.2
neoforge_version=26.1.2.112
minecraft_version_range=[26.1.2,26.2)

# On NeoForge 26.x the loaderVersion field of neoforge.mods.toml is the language provider version,
# not the NeoForge version; the NeoForge version is pinned by the dependency below instead.
language_provider_version=[3,)
neoforge_version_range=[26.1.2,)

loader=neoforge
java_version=25