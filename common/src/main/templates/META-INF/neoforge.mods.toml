modLoader = "javafml"
# On NeoForge 26.x loaderVersion is the language provider version, not the loader version. NeoForge
# itself ships 26.1.2.112, which is what the neoforge dependency below pins.
loaderVersion = "${language_provider_version}"
license = "${mod_license}"
issueTrackerURL = "${issues_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "icon.png"
displayURL = "${project_url}"

# The nickname is stored on the player's connection handler and read while the player joins, which
# needs these four classes patched in.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"