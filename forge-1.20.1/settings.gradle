pluginManagement {
    repositories {
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        gradlePluginPortal()
        mavenCentral()
    }

    plugins {
        id 'org.spongepowered.mixin' version "${mixin_gradle_version}"
    }
}

rootProject.name = 'stylednicknames-forge-1.20.1'