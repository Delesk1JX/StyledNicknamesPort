## Minecraft 1.21.1 with NeoForge
minecraft_version=1.21.1
neoforge_version=21.1.252
minecraft_version_range=[1.21.1,1.22)

# The loaderVersion field of neoforge.mods.toml is the language provider version here too, and the
# NeoForge version is pinned by the dependency below instead.
language_provider_version=[4,)
neoforge_version_range=[21.1,)

loader=neoforge
java_version=21
